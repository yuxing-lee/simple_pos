<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心藝花禮 收銀系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50:  '#f8f5f3',
                100: '#ede6e1',
                200: '#dccec4',
                300: '#c9b3a3',
                400: '#b79483',
                500: '#a57865',
                600: '#8d5f4d',
                700: '#73493b',
                800: '#5a362d',
                900: '#442721',
              },
              neutral: {
                50:  '#f5f3f0',
                100: '#ede8e3',
                200: '#e3dbd3',
                300: '#d4c9bd',
                400: '#c5b9a8',
                500: '#bbaa92',
                600: '#a89778',
                700: '#8d7d61',
                800: '#6d624e',
                900: '#4f473b',
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-weight: 300;
        letter-spacing: 0.01em;
        color: #2d2d2d;
      }
      h1, h2, h3, h4, h5, h6 {
        font-weight: 300;
        letter-spacing: 0.05em;
      }
      input, button, select, textarea {
        font-family: inherit;
      }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #c9b3a3; border-radius: 2px; }
    </style>
  </head>
  <body class="bg-neutral-50 h-screen overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
